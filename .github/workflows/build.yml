name: Build MDS Hitung Dzikir v1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract complete project from ZIP
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src
          unzip -q MDS-Hitung-Dzikir-v1.0-lengkap.zip -d build-src
          test -f build-src/app/src/main/java/com/mds/hitungdzikir/MainActivity.java
          test -f build-src/app/src/main/res/raw/mds_logo_intro.mp4
          test -f build-src/app/src/main/res/drawable/mds_logo.jpg
          test -f build-src/app/src/main/res/drawable/quote_1.png
          test -f build-src/app/src/main/res/drawable/quote_7.png

      - name: Make theme independent of AppCompat
        shell: bash
        run: |
          set -e
          cat > build-src/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.MDS" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFC928</item>
                  <item name="android:navigationBarColor">#151515</item>
                  <item name="android:statusBarColor">#151515</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle -p build-src clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MDS-Hitung-Dzikir-v1.0-debug
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Show APK information
        shell: bash
        run: |
          set -e
          ls -lh build-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build-src/app/build/outputs/apk/debug/app-debug.apk
